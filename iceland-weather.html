<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Iceland Weather Conditions</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .station { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .station h2 { margin: 0 0 5px; }
  </style>
</head>
<body>
  <h1>Latest Weather Conditions Across Iceland</h1>
  <div id="weather">Loading...</div>
  <script>
    async function fetchWeather() {
      try {
        const response = await fetch('https://apis.is/weather/observations/en');
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const data = await response.json();
        const container = document.getElementById('weather');
        container.innerHTML = '';
        data.results.forEach(station => {
          const div = document.createElement('div');
          div.className = 'station';
          div.innerHTML = `
            <h2>${station.name}</h2>
            <p>Temperature: ${station.T}°C</p>
            <p>Wind: ${station.F} m/s</p>
            <p>Conditions: ${station.W}</p>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        document.getElementById('weather').textContent = 'Failed to load weather data.';
        console.error('Error fetching weather data:', error);
      }
    }

    fetchWeather();
  </script>
</body>
</html>
